spring:
  application:
    name: workout-session-service
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 30672
    username: guest
    password: guest

jwt:
  public-key-pem: # Set to RSA public key PEM in production (env var JWT_PUBLIC_KEY_PEM)

server:
  port: 8083
  error:
    include-message: never
    include-stacktrace: never

workout-creator-service:
  base-url: http://localhost:8082

resilience4j:
  circuitbreaker:
    instances:
      workoutFetcher:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      workoutFetcher:
        timeout-duration: 5s
