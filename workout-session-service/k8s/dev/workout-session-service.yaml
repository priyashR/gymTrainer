apiVersion: v1
kind: ConfigMap
metadata:
  name: workout-session-service-config
  namespace: dev
data:
  SPRING_PROFILES_ACTIVE: prod
  DATABASE_URL: jdbc:postgresql://postgres:5432/hybridstrength_dev
  SERVER_PORT: "8083"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  WORKOUT_CREATOR_SERVICE_BASE_URL: http://workout-creator-service:8082
---
apiVersion: v1
kind: Secret
metadata:
  name: workout-session-service-secret
  namespace: dev
type: Opaque
stringData:
  DATABASE_USERNAME: postgres
  DATABASE_PASSWORD: postgres
  RABBITMQ_USERNAME: guest
  RABBITMQ_PASSWORD: guest
  JWT_PUBLICKEYPEM: |
    -----BEGIN PUBLIC KEY-----
    MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAwXWJKWsQX+a3oEd4Q1LM
    GcQYhld3V7qZFXDAIJRvqHbHIexpinO0FS8+kqYM0A5MYk0DjWNDZS7/CzpbFFl7
    Zd/CKV65aW7ErUH/MQ3XkrV3bJb7clR743r0sku3/yILMMZ5df/hEVoPCnt6xI4Y
    t/dDhA+k3/HQ0vosxWSkicW6SqNFGYHyfXgFubQb/t92cu4BkXLjgoiUydvSoNLC
    GkAsyuVRl5UcPR7fGmzDIzmdE5233Ix4jUMaD2iT7kZS2XVtx4KuvmdUKiz26zlC
    Qz22YeK8mjsef1L6KrYzTJhMDxDo8OoVrQrp3dQQ1i10JoF9PtDirFNMeNA3F4jI
    2wIDAQAB
    -----END PUBLIC KEY-----
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workout-session-service
  namespace: dev
  labels:
    app: workout-session-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workout-session-service
  template:
    metadata:
      labels:
        app: workout-session-service
    spec:
      containers:
        - name: workout-session-service
          image: workout-session-service:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: workout-session-service-config
            - secretRef:
                name: workout-session-service-secret
          env:
            - name: JWT_PUBLICKEYPEM
              valueFrom:
                secretKeyRef:
                  name: workout-session-service-secret
                  key: JWT_PUBLICKEYPEM
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 100
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 120
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: workout-session-service
  namespace: dev
spec:
  selector:
    app: workout-session-service
  ports:
    - port: 8083
      targetPort: 8083
  type: NodePort
