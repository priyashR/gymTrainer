<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HybridStrength — Log External Activity (Dark Mode)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #121212;
      --bg-surface: #1e1e1e;
      --bg-card: #2a2a2a;
      --text-primary: #f5f5f5;
      --text-secondary: #a0a0a0;
      --accent: #4fc3f7;
      --accent-hover: #29b6f6;
      --success: #66bb6a;
      --error: #ef5350;
      --border: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 24px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 28px; }

    .back-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      display: inline-block;
      margin-bottom: 16px;
    }

    /* Form */
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .form-group .required { color: var(--error); }

    .form-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 16px;
      color: var(--text-primary);
      outline: none;
      min-height: 48px;
    }
    .form-input:focus { border-color: var(--accent); }
    .form-input::placeholder { color: #555; }

    /* Activity Type Selector */
    .activity-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .activity-option {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .activity-option:hover { border-color: var(--accent); }
    .activity-option.selected { border-color: var(--accent); background: #0d2a3a; }
    .activity-option .emoji { font-size: 20px; }
    .activity-option .name { font-size: 12px; color: var(--text-secondary); }
    .activity-option.selected .name { color: var(--accent); }

    /* Two-column row */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Unit selector inline */
    .input-with-unit {
      display: flex;
      gap: 0;
    }
    .input-with-unit input {
      flex: 1;
      border-radius: 10px 0 0 10px;
      border-right: none;
    }
    .input-with-unit .unit-select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 0 10px 10px 0;
      padding: 14px 12px;
      color: var(--text-secondary);
      font-size: 14px;
      min-width: 60px;
      text-align: center;
      cursor: pointer;
    }

    /* Notes textarea */
    .form-textarea {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      min-height: 80px;
      resize: vertical;
      font-family: inherit;
    }
    .form-textarea:focus { border-color: var(--accent); }
    .form-textarea::placeholder { color: #555; }

    /* Submit button */
    .submit-btn {
      width: 100%;
      background: var(--success);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      min-height: 48px;
    }
    .submit-btn:hover { background: #4caf50; }

    /* Validation error */
    .field-error {
      font-size: 12px;
      color: var(--error);
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <a href="#" class="back-link">← Home</a>
  <h1>🏃 Log Activity</h1>
  <p class="subtitle">Record workouts and activities done outside the app.</p>

  <!-- Activity Type (mandatory) -->
  <div class="form-group">
    <label>Activity Type <span class="required">*</span></label>
    <div class="activity-grid">
      <div class="activity-option selected"><span class="emoji">⚽</span><span class="name">Soccer</span></div>
      <div class="activity-option"><span class="emoji">🏸</span><span class="name">Squash</span></div>
      <div class="activity-option"><span class="emoji">🏃</span><span class="name">Running</span></div>
      <div class="activity-option"><span class="emoji">🎾</span><span class="name">Padel</span></div>
      <div class="activity-option"><span class="emoji">⛳</span><span class="name">Golf</span></div>
      <div class="activity-option"><span class="emoji">🏊</span><span class="name">Swimming</span></div>
      <div class="activity-option"><span class="emoji">🚴</span><span class="name">Cycling</span></div>
      <div class="activity-option"><span class="emoji">🥾</span><span class="name">Hiking</span></div>
      <div class="activity-option"><span class="emoji">🏀</span><span class="name">Basketball</span></div>
      <div class="activity-option"><span class="emoji">🎾</span><span class="name">Tennis</span></div>
      <div class="activity-option"><span class="emoji">✏️</span><span class="name">Other</span></div>
    </div>
  </div>

  <!-- Date (mandatory) -->
  <div class="form-group">
    <label>Date <span class="required">*</span></label>
    <input type="date" class="form-input" value="2026-06-16">
  </div>

  <!-- Duration and Calories -->
  <div class="form-row">
    <div class="form-group">
      <label>Duration (minutes)</label>
      <input type="number" class="form-input" placeholder="60">
    </div>
    <div class="form-group">
      <label>Calories (kcal)</label>
      <input type="number" class="form-input" placeholder="450">
    </div>
  </div>

  <!-- Distance -->
  <div class="form-group">
    <label>Distance</label>
    <div class="input-with-unit">
      <input type="number" class="form-input" placeholder="5.0">
      <div class="unit-select">km</div>
    </div>
  </div>

  <!-- Notes -->
  <div class="form-group">
    <label>Notes</label>
    <textarea class="form-textarea" placeholder="How did it feel? Any stats to remember..."></textarea>
  </div>

  <!-- Submit -->
  <button class="submit-btn">Save Activity</button>

</body>
</html>
