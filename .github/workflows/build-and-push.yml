name: Build and Push to Docker Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  build-and-push:
    # Only run on direct push to main, or when a PR is merged (not just closed)
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Java backend services ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build auth-service JAR
        run: mvn package -DskipTests -B -q
        working-directory: auth-service

      - name: Build workout-creator-service JAR
        run: mvn package -DskipTests -B -q
        working-directory: workout-creator-service

      - name: Build workout-session-service JAR
        run: ./mvnw package -DskipTests -B -q
        working-directory: workout-session-service

      # --- Docker ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push auth-service
        uses: docker/build-push-action@v6
        with:
          context: auth-service
          push: true
          tags: |
            priyash/gym-app:auth-service-latest
#             priyash/gym-app:auth-service-${{ github.sha }}

      - name: Build and push workout-creator-service
        uses: docker/build-push-action@v6
        with:
          context: workout-creator-service
          push: true
          tags: |
            priyash/gym-app:workout-creator-service-latest
#             priyash/gym-app:workout-creator-service-${{ github.sha }}

      - name: Build and push workout-session-service
        uses: docker/build-push-action@v6
        with:
          context: workout-session-service
          push: true
          tags: |
            priyash/gym-app:workout-session-service-latest
#             priyash/gym-app:workout-session-service-${{ github.sha }}

      - name: Build and push workout-coach-ui
        uses: docker/build-push-action@v6
        with:
          context: workout-coach-ui
          push: true
          tags: |
            priyash/gym-app:workout-coach-ui-latest
#             priyash/gym-app:workout-coach-ui-${{ github.sha }}
